services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:16-alpine
    container_name: clover-book-db
    environment:
      POSTGRES_USER: clover
      POSTGRES_PASSWORD: clover
      POSTGRES_DB: cloverbook
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clover -d cloverbook"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Clover Book 应用（API + 前端静态文件）
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clover-book-app
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://clover:clover@postgres:5432/cloverbook
      JWT_SECRET: ${JWT_SECRET:-clover-book-production-secret-change-me}
      DATA_DIR: /app/data
      UPLOAD_DIR: /app/data/uploads
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    volumes:
      - appdata:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  appdata:
